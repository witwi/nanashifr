<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>under construction 2000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'MS Sans Serif', 'Microsoft Sans Serif', 'Lucida Console', 'Monaco', 'Consolas', monospace;
            -webkit-font-smoothing: none;  
            font-smooth: never;           
            image-rendering: pixelated;   
        }
        .old-school {
            color: #000000;
            font-size: 5vw;                
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 3px;             
            text-align: center;
            line-height: 1.3;
            border: 3px solid #000000;       
            padding: 15px 30px;
            background-color: #ffffff;
            max-width: 90%;
            display: inline-block;
            box-shadow: 5px 5px 0 #cccccc;  
            text-shadow: none;
            transition: all 0.2s ease;
        }
        .old-school:hover {
            animation: rainbow 1.5s linear infinite;
        }
        @keyframes rainbow {
            0% { color: #ff0000; }
            14% { color: #ff7f00; }
            28% { color: #ffff00; }
            42% { color: #00ff00; }
            57% { color: #0000ff; }
            71% { color: #4b0082; }
            85% { color: #8f00ff; }
            100% { color: #ff0000; }
        }
        @media (max-width: 600px) {
            .old-school {
                font-size: 8vw;
                padding: 10px 15px;
                letter-spacing: 2px;
                border-width: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="old-school">
        АНДЕР КАНСТРАКШН<br>КАМБЕК ЛЕЙТЕР!
    </div>
</body>
</html>
